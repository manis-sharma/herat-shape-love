<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you &lt;3</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100dvh;
            background: black;
            opacity: 0;
            transition: opacity 1.4s ease;
        }

        body.revealed canvas {
            opacity: 1;
        }

        #teaser {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            z-index: 3;
            color: rgba(255, 255, 255, 0.72);
            background: #000;
            transition: opacity 1.1s ease, visibility 1.1s ease;
        }

        #teaser.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .teaser-content {
            width: min(100%, 360px);
            text-align: center;
            font-family: Georgia, serif;
        }

        .teaser-code {
            margin: 0 0 18px;
            color: rgba(135, 206, 250, 0.78);
            font: 14px/1.4 Georgia, serif;
        }

        .teaser-title {
            margin: 0 0 24px;
            color: rgba(255, 255, 255, 0.82);
            font-size: 38px;
            line-height: 1.1;
            font-weight: normal;
        }

        #revealButton {
            min-height: 48px;
            max-width: 100%;
            padding: 13px 22px;
            border: 1px solid rgba(135, 206, 250, 0.65);
            border-radius: 999px;
            color: white;
            background: rgba(30, 144, 255, 0.24);
            font: 15px Georgia, serif;
            cursor: pointer;
            touch-action: manipulation;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        #revealButton:hover,
        #revealButton:focus-visible {
            border-color: white;
            color: white;
            outline: none;
        }

        #musicPrompt {
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            box-sizing: border-box;
            max-width: calc(100% - 32px);
            min-height: 48px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 999px;
            color: white;
            background: rgba(0, 0, 0, 0.72);
            font: 600 14px/1.2 sans-serif;
            cursor: pointer;
            touch-action: manipulation;
            z-index: 2;
        }

        #musicPrompt[hidden] {
            display: none;
        }

        @media (max-width: 420px) {
            .teaser-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>
<main id="teaser" aria-label="A small surprise">
    <div class="teaser-content">
        <p class="teaser-code">I made something for you</p>
        <h1 class="teaser-title">A little surprise, just for you</h1>
        <button id="revealButton" type="button">Open your surprise</button>
    </div>
</main>
<button id="musicPrompt" type="button" hidden>Tap to start music</button>

<script>
"use strict";

// ==============================
// CANVAS
// ==============================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const WIDTH = 2000;
let HEIGHT = 1200;

const SCALE = 20;


// ==============================
// SETTINGS
// ==============================

const WORDS = [
    "love you",
    "Love You",
    "LOVE YOU"
];

const CENTER_TEXT = " Love You ";

const COLORS = [
    [70, 130, 180],
    [30, 144, 255],
    [0, 191, 255],
    [100, 149, 237],
    [65, 105, 225]
];


// ==============================
// CANVAS RESIZE
// ==============================

function resizeCanvas() {
    HEIGHT =
        WIDTH *
        (window.innerHeight / window.innerWidth);

    canvas.width = WIDTH;
    canvas.height = HEIGHT;
}

resizeCanvas();


// ==============================
// RANDOM HELPERS
// ==============================

function randomChoice(array) {
    return array[
        Math.floor(Math.random() * array.length)
    ];
}

function randomRange(min, max) {
    return min + Math.random() * (max - min);
}

function randomInt(min, max) {
    return Math.floor(
        randomRange(min, max + 1)
    );
}


// ==============================
// PARTICLE CLASS
// ==============================

class Particle {

    constructor(x, y, order, kind) {

        this.x = x;
        this.y = y;

        this.order = order;
        this.kind = kind;

        this.word = randomChoice(WORDS);
        this.color = randomChoice(COLORS);

        this.alpha = 0;

        this.flicker = randomRange(
            0,
            Math.PI * 2
        );

        this.delay = 0;

        this.sizeMult = randomRange(
            0.85,
            1.15
        );

        this.fontSize =
            kind === "outline"
                ? 20
                : 17;
    }
}


// ==============================
// HEART EQUATION
// ==============================

function heartXY(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x,
        y: -y
    };
}


// ==============================
// SCREEN POSITION
// ==============================

function toScreen(x, y) {

    return {
        x: x * SCALE + WIDTH / 2,
        y: y * SCALE + HEIGHT / 2
    };
}


// ==============================
// BUILD OUTLINE PARTICLES
// ==============================

function buildOutlineParticles(
    nOutline,
    minGap = 30
) {

    const particles = [];
    const placed = [];

    for (let i = 0; i < nOutline; i++) {

        const t =
            (i / nOutline) *
            Math.PI * 2;

        const heart =
            heartXY(t);

        const screenPos =
            toScreen(
                heart.x,
                heart.y
            );

        let tooClose = false;

        for (const point of placed) {

            const dx =
                screenPos.x - point.x;

            const dy =
                screenPos.y - point.y;

            const distance =
                Math.hypot(dx, dy);

            if (distance < minGap) {
                tooClose = true;
                break;
            }
        }

        if (tooClose) {
            continue;
        }

        placed.push(screenPos);

        particles.push(
            new Particle(
                screenPos.x,
                screenPos.y,
                i,
                "outline"
            )
        );
    }

    return particles;
}


// ==============================
// BUILD FILL PARTICLES
// ==============================

function buildFillParticles(
    nFill,
    minGap = 46
) {

    const particles = [];
    const placed = [];

    let attempts = 0;

    const maxAttempts =
        nFill * 80;

    while (
        particles.length < nFill &&
        attempts < maxAttempts
    ) {

        attempts++;

        const t =
            randomRange(
                0,
                Math.PI * 2
            );

        const r =
            randomRange(
                0.0,
                0.86
            );

        const heart =
            heartXY(t);

        const px =
            heart.x * r;

        const py =
            heart.y * r;

        const screenPos =
            toScreen(px, py);

        let tooClose = false;

        for (const point of placed) {

            const dx =
                screenPos.x - point.x;

            const dy =
                screenPos.y - point.y;

            if (
                Math.hypot(dx, dy)
                < minGap
            ) {
                tooClose = true;
                break;
            }
        }

        if (tooClose) {
            continue;
        }

        placed.push(screenPos);

        particles.push(
            new Particle(
                screenPos.x,
                screenPos.y,
                randomInt(0, 320),
                "fill"
            )
        );
    }

    return particles;
}


// ==============================
// RGB COLOR
// ==============================

function rgb(color) {

    return `rgb(
        ${color[0]},
        ${color[1]},
        ${color[2]}
    )`;
}


// ==============================
// DRAW GLOW TEXT
// ==============================

function drawGlowText(
    word,
    color,
    x,
    y,
    alpha,
    fontSize,
    sizeMult
) {

    if (alpha <= 0) {
        return;
    }

    const scaledSize =
        Math.max(
            1,
            Math.floor(
                fontSize * sizeMult
            )
        );

    ctx.save();

    ctx.font =
        `bold ${scaledSize}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const colorString =
        rgb(color);

    // --------------------------
    // LARGE GLOW
    // --------------------------

    if (alpha > 10) {

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            `rgba(
                ${color[0]},
                ${color[1]},
                ${color[2]},
                ${alpha / 255}
            )`;

        ctx.fillStyle =
            `rgba(
                ${color[0]},
                ${color[1]},
                ${color[2]},
                ${alpha / 1785}
            )`;

        ctx.fillText(
            word,
            x,
            y
        );


        // --------------------------
        // SMALLER GLOW
        // --------------------------

        ctx.shadowBlur = 10;

        ctx.fillStyle =
            `rgba(
                ${color[0]},
                ${color[1]},
                ${color[2]},
                ${alpha / 765}
            )`;

        ctx.fillText(
            word,
            x,
            y
        );
    }


    // --------------------------
    // MAIN TEXT
    // --------------------------

    ctx.shadowBlur = 4;

    ctx.fillStyle =
        `rgba(
            ${color[0]},
            ${color[1]},
            ${color[2]},
            ${alpha / 255}
        )`;

    ctx.fillText(
        word,
        x,
        y
    );

    ctx.restore();
}


// ==============================
// MAIN SETUP
// ==============================

let outline;
let fill;
let particles;

let frame = 0;

function setup() {

    outline =
        buildOutlineParticles(160);

    fill =
        buildFillParticles(130);

    const outlineSpan =
        outline.length > 0
            ? Math.max(
                ...outline.map(
                    p => p.order
                )
            )
            : 0;

    const framesPerStep = 1.6;

    const fillStartFrame =
        Math.floor(
            outlineSpan *
            framesPerStep
        ) + 30;


    // --------------------------
    // PARTICLE DELAYS
    // --------------------------

    for (const p of fill) {

        p.delay =
            fillStartFrame +
            p.order;
    }

    for (const p of outline) {

        p.delay =
            Math.floor(
                p.order *
                framesPerStep
            );
    }


    particles = [
        ...outline,
        ...fill
    ];

    return fillStartFrame;
}


// ==============================
// CENTER TEXT
// ==============================

function drawCenterText(
    centerStart
) {

    if (frame <= centerStart) {
        return;
    }

    const progress =
        Math.min(
            1.0,
            (frame - centerStart) / 60
        );

    const centerAlpha =
        Math.floor(
            255 *
            (
                1 -
                Math.exp(
                    -progress * 8
                )
            )
        );


    // --------------------------
    // PULSE
    // --------------------------

    const pulse =
        1.0 +
        0.025 *
        Math.sin(
            frame * 0.05
        );


    ctx.save();

    ctx.font =
        "bold 54px Georgia";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";


    // --------------------------
    // CENTER GLOW
    // --------------------------

    if (centerAlpha > 10) {

        ctx.shadowBlur = 35;

        ctx.shadowColor =
            `rgba(
                255,
                250,
                245,
                ${centerAlpha / 255}
            )`;

        ctx.fillStyle =
            `rgba(
                255,
                250,
                245,
                ${centerAlpha / 1275}
            )`;

        ctx.fillText(
            CENTER_TEXT,
            WIDTH / 2,
            HEIGHT / 2
        );
    }


    // --------------------------
    // MAIN CENTER TEXT
    // --------------------------

    ctx.shadowBlur = 8;

    ctx.fillStyle =
        `rgba(
            255,
            250,
            245,
            ${centerAlpha / 255}
        )`;

    ctx.translate(
        WIDTH / 2,
        HEIGHT / 2
    );

    ctx.scale(
        pulse,
        pulse
    );

    ctx.fillText(
        CENTER_TEXT,
        0,
        0
    );

    ctx.restore();
}


// ==============================
// ANIMATION
// ==============================

const fillStartFrame =
    setup();

const centerStart =
    fillStartFrame + 200;

let animationId = null;

function animate() {

    frame++;


    // --------------------------
    // CLEAR SCREEN
    // --------------------------

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    // --------------------------
    // PARTICLES
    // --------------------------

    for (const p of particles) {

        if (
            frame > p.delay &&
            p.alpha < 255
        ) {

            p.alpha =
                Math.min(
                    255,
                    p.alpha +
                    14 +
                    randomInt(0, 4)
                );
        }


        let flick = 1.0;

        if (p.alpha >= 255) {

            flick =
                0.75 +
                0.25 *
                Math.sin(
                    frame * 0.04 +
                    p.flicker
                );
        }


        const alpha =
            Math.floor(
                p.alpha * flick
            );


        if (alpha <= 0) {
            continue;
        }


        drawGlowText(
            p.word,
            p.color,
            p.x,
            p.y,
            alpha,
            p.fontSize,
            p.sizeMult
        );
    }


    // --------------------------
    // CENTER TEXT
    // --------------------------

    drawCenterText(
        centerStart
    );


    animationId =
        requestAnimationFrame(
            animate
        );
}


// ==============================
// MUSIC
// ==============================
//
// Put love_you.mp3 in the SAME
// folder as this HTML file.
//
// Example:
//
// index.html
// love_you.mp3
//
// ==============================

const music =
    new Audio("./love_you.mp3");

const musicPrompt =
    document.getElementById("musicPrompt");

const teaser =
    document.getElementById("teaser");

const revealButton =
    document.getElementById("revealButton");

music.preload = "auto";
music.loop = false;
music.volume = 1.0;


// ------------------------------
// START MUSIC
// ------------------------------

async function startMusic() {

    try {

        await music.play();

        console.log(
            "love_you.mp3 started."
        );

        musicStarted = true;
        musicPrompt.hidden = true;

    } catch (error) {

        console.log(
            "Autoplay blocked by browser."
        );

        musicPrompt.hidden = false;
    }
}


// ------------------------------
// STOP MUSIC
// ------------------------------

function stopMusic() {

    music.pause();

    try {
        music.currentTime = 0;
    } catch (error) {
        // Ignore reset errors
    }
}


// ------------------------------
// PRELOAD MP3
// ------------------------------

music.load();


// ------------------------------
// TRY AUTOPLAY ON PAGE LOAD
// ------------------------------

// ------------------------------
// FALLBACK CLICK
// ------------------------------
//
// Browsers can block autoplay.
// A click/tap will then start music.
//

let musicStarted = false;

async function userStartMusic() {

    if (musicStarted) {
        return;
    }

    try {

        await music.play();

        musicStarted = true;
        musicPrompt.hidden = true;

        document.removeEventListener(
            "click",
            userStartMusic
        );

        document.removeEventListener(
            "touchstart",
            userStartMusic
        );

        console.log(
            "Music started after user interaction."
        );

    } catch (error) {

        console.log(
            "Could not start music:",
            error
        );
    }
}


document.addEventListener(
    "click",
    userStartMusic,
    { passive: true }
);

document.addEventListener(
    "touchstart",
    userStartMusic,
    { passive: true }
);

musicPrompt.addEventListener(
    "click",
    userStartMusic
);


// ------------------------------
// STOP WHEN TAB IS HIDDEN
// ------------------------------

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            stopMusic();

        }
    }
);


// ------------------------------
// STOP WHEN LEAVING PAGE
// ------------------------------

window.addEventListener(
    "pagehide",
    () => {

        stopMusic();

    }
);

window.addEventListener(
    "beforeunload",
    () => {

        stopMusic();

    }
);


// ==============================
// ESC TO STOP EVERYTHING
// ==============================

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            stopMusic();

            if (animationId !== null) {

                cancelAnimationFrame(
                    animationId
                );

            }

            document.body.innerHTML = "";
        }
    }
);


// ==============================
// START ANIMATION
// ==============================

function revealAnimation() {

    if (animationId !== null) {
        return;
    }

    document.body.classList.add("revealed");
    teaser.classList.add("is-hidden");
    revealButton.disabled = true;

    if (window.location.hash !== "#open") {
        window.history.replaceState(null, "", "#open");
    }

    animate();
    startMusic();
}


revealButton.addEventListener(
    "click",
    revealAnimation
);

window.addEventListener(
    "load",
    () => {

        if (window.location.hash === "#open") {
            teaser.classList.add("is-hidden");
            document.body.classList.add("revealed");
            animate();
            startMusic();
        }
    }
);

</script>

</body>
</html>
